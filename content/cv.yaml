# =============================================================================
# content/cv.yaml - you, and every section of your CV.
#
# This file and its four neighbours (`publications.bib`, `talks.bib`, `posts/`,
# `media/`) are the adopter-owned record and media interface. This file is the
# landmark the build walks up to find.
#
# Consumers:
#   * the printed CV - `node scripts/build-cv-data.mjs` -> `cv/generated/cv-data.tex`
#   * the website    - `web/src/lib/cv.ts` and `web/src/lib/record.ts`
#
# Layout, spacing, fonts, table column widths and the order of ordinary CV parts
# are NOT here: they belong to `cv/preamble.tex`, the shared layout, and to
# `cv/cv.tex`, which sets this CV's own and decides which top-level entry lists
# the PDF prints. The order and inclusion of bibliography subsections are
# declared under `publications:` and `talks:`.
#
# `content/README.md` is the documentation. Everything below is described there.
#
# -----------------------------------------------------------------------------
# Inline markup allowed in any prose field (portable, not LaTeX):
#   **bold**            -> \textbf{...}
#   _italic_            -> \emph{...}   (an underscore inside a word - a_b,
#                       snake_case, file_name.txt - is literal, as in Markdown;
#                       an unclosed _ or ** is an error, not silent emphasis)
#   [text](https://...) -> \href{...}{text}
#   *                   passes through literally (so "CORE Rank: A*" is safe)
#
# No URL in this file - a link target above or any URL-valued field below - may
# contain \ ~ _ ^ $ { }; percent-encode them (~ is %7E, _ is %5F, \ is %5C).
# Every \href lands inside a \newcommand body, where TeX consumes those characters
# before hyperref can rescue them, so the build raises rather than emitting a
# wrong link.
#
# Characters that carry typographic meaning, written as real Unicode:
#   -- em dash   (U+2014)  ->  ---     e.g. "settings-especially healthcare"
#   - en dash    (U+2013)  ->  --      used for date and year ranges
#   - non-breaking hyphen (U+2011) -> {-}   (suppresses a line break at that hyphen)
#   + superscript plus    (U+207A)  ->  $^{+}$   e.g. "Erasmus+"
#   EUR EURO SIGN (U+20AC) ->  \euro{}
#
# Everything else is escaped automatically: &, %, $, #, _, {, }, ~, ^, backslash.
#
# -----------------------------------------------------------------------------
# `except:` - a declared exception to one website consistency check, written on
# the fact it excuses:
#
#   except:
#     - check: announced-in-own-year   # exactly one id from web/src/lib/consistency.ts
#       because: >-                    # prose, rendered to the reader
#         why both values are correct
#       until: 2027-01-01              # ISO day, or `permanent`
#
# The website's build refuses an exception naming an unknown check, carrying a
# blank reason, or past its `until` date. `build-cv-data.mjs` ignores the key.
# =============================================================================

