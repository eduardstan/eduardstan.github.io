  bio:
    short: Ionel Eduard Stan is an Assistant Professor (RTD/a) at the University of Milano-Bicocca
      (DISCo), within the Intelligent Sensing Laboratory (ISLab). His research builds
      **trustworthy, interpretable artificial intelligence (AI) for sequential and multimodal
      data**, combining modern learning with **logic-based and neuro-symbolic** representations
      to obtain explanations that can be inspected, validated, and monitored. His work targets
      high-impact settings—especially healthcare and telemonitoring—and extends to smart
      environments. He contributes to Italian programmes (ANTHEM/PNC; previously iNEST/PNRR) and
      serves the community as Associate Editor (_Neurocomputing_, _Frontiers in Artificial
      Intelligence_), including as Lead Editor of a special issue on explainable AI (XAI) for
      human-centric healthcare, as well as Area Chair and Organizing/Program Committee member
      for major AI venues. He teaches Databases (B.Sc.), Intelligent Consumer Technologies
      (M.Sc.), and Foundations of AI (2nd-level Master's).
    long: >-
      I am an **Assistant Professor** (_Ricercatore a Tempo Determinato di tipo A---RTD/A_) at
      the University of Milano-Bicocca, where I bridge the gap between formal methods, symbolic
      reasoning, and cutting-edge AI technologies. My expertise lies in leveraging **formal
      logic and symbolic AI** to enhance the interpretability and transparency of machine
      learning models, particularly within the rapidly evolving field of **formal explainable AI
      (FXAI)**.


      At the **Intelligent Sensing Lab (ISLab)**, I collaborate with a team of deep learning
      experts, bringing my background in symbolic methods to bear on the challenges of
      explainability. Our goal is to ensure that the AI systems we develop are effective _and_
      trustworthy, particularly in high-stakes applications like healthcare. This work is
      central to our contributions to the **ANTHEM project**, where we focus on developing smart
      environments and innovative sensors for proximity medicine, working alongside leading
      institutions and healthcare providers.


      In addition to my research, I am deeply committed to my role as an educator. I actively
      seek out and **mentor students**, guiding them through their theses and fostering their
      development as future researchers. My teaching is informed by my belief in the importance
      of **transparency and ethics in AI**, principles that are increasingly critical as AI
      technologies become more integrated into society.


      A vision of AI drives my work as a tool for **enhancing human capabilities**, built on a
      foundation of trust, ethics, and collaboration. I am excited to continue exploring the
      potential of **neuro-symbolic AI** and FXAI, and I am always open to new partnerships that
      align with these goals. Let’s connect and push the boundaries of what AI can achieve
      together.
  focus: "**Trustworthy (explainable and neuro-symbolic) AI for time series and multimodal
    signals**, with an emphasis on **logic-guided learning and representation, auditable
    explanations, and model monitoring**, applied to healthcare, telemonitoring, and smart
    environments."
  footer: "**Data protection and permitted use.** I authorize the processing of my personal data
