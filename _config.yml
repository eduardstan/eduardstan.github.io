# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
#
# What is left of the Jekyll site's configuration after the cutover: the fields
# that state who the site belongs to and where else to find them. `web/` reads
# them at build time — `web/src/lib/record.ts`'s `profile()` — and renders them
# in the footer, and `record.ts` finds the repository root by walking up for
# this file, so its name and location are load-bearing.
#
# Everything else this file used to hold — the theme, the plugin list, the
# `exclude:` list that kept `web/` out of the Jekyll build, the analytics and
# comment provider IDs — went with the site it configured. Do not bring an
# analytics ID back: see "Settled decisions" in CLAUDE.md.
#
# The name order is deliberate. The publications are authored "Ionel Eduard
# Stan", so the site renders the name that way. Not a typo — do not swap these.

first_name: Ionel
middle_name: Eduard
last_name: Stan
email: ioneleduard.stan@unimib.it

# One footer link per field that carries a value; the empty ones are named on
# the site as accounts it has no ID for, rather than silently omitted.
github_username: eduardstan
linkedin_username: edust
