# -----------------------------------------------------------------------------
# Short Bio
# -----------------------------------------------------------------------------
short_bio: >-
  Ionel Eduard Stan is an Assistant Professor (RTD/a) at the University of
  Milano-Bicocca (DISCo), within the Intelligent Sensing Laboratory (ISLab).
  His research builds **trustworthy, interpretable artificial intelligence (AI)
  for sequential and multimodal data**, combining modern learning with
  **logic-based and neuro-symbolic** representations to obtain explanations that
  can be inspected, validated, and monitored. His work targets high-impact
  settings—especially healthcare and telemonitoring—and extends to smart
  environments. He contributes to Italian programmes (ANTHEM/PNC; previously
  iNEST/PNRR) and serves the community as Associate Editor (_Neurocomputing_,
  _Frontiers in Artificial Intelligence_), including as Lead Editor of a special
  issue on explainable AI (XAI) for human-centric healthcare, as well as Area
  Chair and Organizing/Program Committee member for major AI venues. He teaches
  Databases (B.Sc.), Intelligent Consumer Technologies (M.Sc.), and Foundations
  of AI (2nd-level Master's).

# -----------------------------------------------------------------------------
# Research Focus
# -----------------------------------------------------------------------------
research_focus: >-
  **Trustworthy (explainable and neuro-symbolic) AI for time series and
  multimodal signals**, with an emphasis on **logic-guided learning and
  representation, auditable explanations, and model monitoring**, applied to
  healthcare, telemonitoring, and smart environments.

