name: Web (Astro) CI

# Build check only for the Astro rebuild under web/. This workflow must never
# deploy or publish: the live site is still built from the Jekyll tree by
# deploy.yml, and cutover is a separate, explicitly approved change.

# The site reads the repository's own data files at build time, so an edit to
# cv/cv.yaml, the bibliography, a post, the about page or _config.yml can break
# the Astro build without touching web/. Those paths trigger this workflow for
# that reason. `src/lib/record.ts`'s SOURCES is the list they have to cover.

on:
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - "cv/**"
      - "_bibliography/**"
      - "_posts/**"
      - "_pages/**"
      - "_config.yml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "cv/**"
      - "_bibliography/**"
      - "_posts/**"
      - "_pages/**"
      - "_config.yml"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12.0.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install 💾
        run: npm ci

      - name: Type-check 🔎
        run: npx astro check

      # The self-checks assert the readers against the repository's real data
      # files and exercise the consistency gate before the build hook enforces
      # it.
      - name: Self-check 🧪
        run: npm test

      - name: Build 🔧
        run: npm run build
